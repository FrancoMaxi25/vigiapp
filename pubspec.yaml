name: vigiapp
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.5.0

  # Mapas y GPS
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^11.0.0

  # Cámara y galería
  image_picker: ^1.1.2

  # Permisos en tiempo de ejecución
  permission_handler: ^11.3.1

  # Almacenamiento local offline
  sqflite: ^2.3.3
  path: ^1.9.0

  # Preferencias persistentes
  shared_preferences: ^2.2.3

  # Notificaciones locales
  flutter_local_notifications: ^17.2.0

  # Utilidades
  uuid: ^4.4.0
  intl: ^0.19.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/vigiapp_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0D1B4B"
  adaptive_icon_foreground: "assets/icon/vigiapp_icon.png"